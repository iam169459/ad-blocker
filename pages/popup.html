<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Purple Ad Blocker</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="popup-container">
    <header class="popup-header">
      <div class="logo">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2L2 7l10 5 10-5-10-5z"/>
          <path d="M12 17.5a5.5 5.5 0 0 1-5.5-5.5h-1a5.5 5.5 0 1 1 11 0h-1a5.5 5.5 0 0 1-5.5 5.5z"/>
          <path fill="currentColor" d="M10.5 12h3v1.5h-3z"/>
        </svg>
        <span class="app-title">Purple Ad Blocker</span>
      </div>
      <span class="version">v2.0.0</span>
    </header>

    <main class="popup-body">
      <!-- Main Toggle -->
      <section class="section">
        <div class="toggle-row">
          <div class="toggle-info">
            <h3>Protection</h3>
            <p class="status-text" id="statusText">Active on this site</p>
          </div>
          <button id="mainToggle" class="toggle-switch" aria-label="Toggle ad blocking">
            <span class="toggle-track"></span>
            <span class="toggle-thumb"></span>
          </button>
        </div>
      </section>

      <!-- Stats -->
      <section class="section stats-section">
        <div class="stat-cards">
          <div class="stat-card">
            <span class="stat-value" id="statTotal">0</span>
            <span class="stat-label">Blocked Total</span>
          </div>
          <div class="stat-card">
            <span class="stat-value" id="statSession">0</span>
            <span class="stat-label">This Session</span>
          </div>
          <div class="stat-card">
            <span class="stat-value" id="statPage">0</span>
            <span class="stat-label">On This Page</span>
          </div>
        </div>
      </section>

      <!-- Quick Filters -->
      <section class="section">
        <h4 class="section-title">Filter Lists</h4>
        <div class="filter-list" id="filterLists">
          <!-- Populated by JS -->
        </div>
      </section>

      <!-- Site Controls -->
      <section class="section">
        <h4 class="section-title">This Site</h4>
        <div class="site-controls">
          <button id="btnZapper" class="btn btn-secondary">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
            </svg>
            <span>Element Zapper</span>
          </button>
          <button id="btnAllowlist" class="btn btn-secondary">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            </svg>
            <span>Allowlist</span>
          </button>
        </div>
      </section>

      <!-- Action Buttons -->
      <section class="section">
        <div class="action-buttons">
          <button id="btnResetStats" class="btn btn-outline">Reset Stats</button>
          <button id="btnSettings" class="btn btn-primary">Settings</button>
        </div>
      </section>

      <!-- Status Bar -->
      <div class="status-bar" id="statusBar"></div>
    </main>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
