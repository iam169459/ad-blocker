<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Purple Ad Blocker - Settings</title>
  <link rel="stylesheet" href="options.css" />
</head>
<body>
  <div class="options-container">
    <header class="options-header">
      <div class="header-left">
        <button class="back-btn" onclick="window.close()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
          </svg>
          <span>Back</span>
        </button>
        <h1>Settings</h1>
      </div>
      <div class="header-right">
        <button id="btnExport" class="btn btn-outline" title="Export settings">⬇️ Export</button>
        <input type="file" id="importFile" accept=".json" hidden />
        <button id="btnImport" class="btn btn-outline" title="Import settings">⬆️ Import</button>
      </div>
    </header>

    <nav class="options-nav" id="optionsNav">
      <!-- Tabs will be rendered by JS -->
    </nav>

    <main class="options-body" id="optionsBody">
      <!-- Tab content will be rendered by JS -->
    </main>
  </div>

  <script type="module" src="options.js"></script>
</body>
</html>
